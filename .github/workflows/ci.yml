name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run contrast-test
      - run: bun run dep-guard
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: node consumer smoke
        run: |
          set -euo pipefail
          TARBALL="$PWD/$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/c" && cd "$RUNNER_TEMP/c"
          npm init -y >/dev/null && npm pkg set type=module >/dev/null
          npm install "$TARBALL"
          node -e 'import("@corbits/react-ui").then((m) => { for (const n of ["Button", "Conversation", "Badge"]) if (typeof m[n] !== "function") throw new Error("missing export: " + n); })'

  policy-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: corbitsdev/corbits-triage/packages/policy-check-action@28a902e9a6e2f7ec53c581425b72d97c6800fc89
